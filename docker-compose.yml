
services:
  api:
    build:
      context: .
      dockerfile: LevelUpAPI/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      - db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=LevelUpDB;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=true;
  
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: levelup-sqlserver
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

volumes:
  sql_data:
